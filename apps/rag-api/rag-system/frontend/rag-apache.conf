# Apache Virtual Host Configuration for RAG System Frontend
# Place in: /etc/apache2/sites-available/rag-system.conf
# Enable with: sudo a2ensite rag-system.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName rag.yourdomain.com
    ServerAlias www.rag.yourdomain.com

    DocumentRoot /var/www/rag-system/frontend/public

    <Directory /var/www/rag-system/frontend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny access to src/ directory
    <Directory /var/www/rag-system/frontend/src>
        Require all denied
    </Directory>

    # PHP settings
    php_value upload_max_filesize 10M
    php_value post_max_size 12M
    php_value max_execution_time 120
    php_value memory_limit 128M

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/rag-error.log
    CustomLog ${APACHE_LOG_DIR}/rag-access.log combined
</VirtualHost>

